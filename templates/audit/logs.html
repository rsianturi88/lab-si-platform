{% extends 'base.html' %}{% block content %}<h1>Audit Log</h1><div class="card"><table><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Path</th><th>IP</th></tr>{% for l in page %}<tr><td>{{ l.created_at }}</td><td>{{ l.user|default:'-' }}</td><td>{{ l.action }}</td><td>{{ l.path }}</td><td>{{ l.ip_address|default:'-' }}</td></tr>{% empty %}<tr><td colspan="5">Belum ada log.</td></tr>{% endfor %}</table></div>{% endblock %}
